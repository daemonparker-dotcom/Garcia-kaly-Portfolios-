<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garcia Mavoungou Kali — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Outfit:wght@200;300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070f;
  --bg2:#080c18;
  --card:#0c1222;
  --border:rgba(255,255,255,0.06);
  --gold:#d4a853;
  --gold2:#f0cb70;
  --teal:#0ea5e9;
  --teal2:#38bdf8;
  --violet:#8b5cf6;
  --text:#eef2ff;
  --dim:#8899bb;
  --muted:#2d3d5a;
  --glow-g:rgba(212,168,83,0.15);
  --glow-t:rgba(14,165,233,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%;}

/* CURSOR */
.cur{position:fixed;width:10px;height:10px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .25s,background .25s}
.cur-r{position:fixed;width:36px;height:36px;border:1px solid rgba(212,168,83,.45);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,opacity .2s}

/* NOISE */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");pointer-events:none;z-index:0;mix-blend-mode:overlay}

body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden;width:100%;max-width:100vw;position:relative;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:1.4rem 5rem;background:rgba(5,7,15,0.72);backdrop-filter:blur(28px);border-bottom:1px solid rgba(255,255,255,0.02)}
nav.scrolled{padding:.8rem 5rem;}
.nav-logo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:2.5rem;list-style:none;}
.nav-links a{color:var(--dim);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;position:relative;transition:color .3s;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s;}
.nav-links a:hover{color:var(--gold);}
.nav-links a:hover::after{width:100%;}
.nav-cv-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1.2rem;border:1px solid rgba(212,168,83,.3);color:var(--gold);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;background:transparent;border-radius:8px}
.nav-cv-btn:hover{background:rgba(212,168,83,.1);border-color:var(--gold);}

/* BADGE DISPONIBLE NAVBAR */
.nav-available-badge{display:inline-flex;align-items:center;gap:.45rem;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:100px;padding:.35rem .9rem;font-size:.6rem;color:#a7f3d0}
.nav-avail-dot{width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0;animation:bpulse 2s infinite;}

/* HERO */
#hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;}
.hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse 70% 70% at 10% 50%,rgba(212,168,83,.07) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 88% 35%,rgba(14,165,233,.06) 0%,transparent 60%)}
.hero-grid{position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:60px 60px;animation:gridDrift 60s linear infinite;opacity:.12}
@keyframes gridDrift{from{transform:translateY(0);}to{transform:translateY(55px);}}

/* decorative corner lines */
.hero-corner-tl{position:absolute;top:100px;left:5rem;width:80px;height:80px;border-top:1px solid rgba(212,168,83,.2);border-left:1px solid rgba(212,168,83,.2);z-index:2;}
.hero-corner-br{position:absolute;bottom:4rem;right:52%;width:60px;height:60px;border-bottom:1px solid rgba(14,165,233,.2);border-right:1px solid rgba(14,165,233,.2);z-index:2;}

.hero-left{display:flex;flex-direction:column;justify-content:center;padding:9rem 3.5rem 5rem 6.5rem;position:relative;z-index:2;}

.h-badge{display:inline-flex;align-items:center;gap:.6rem;background:rgba(212,168,83,.07);border:1px solid rgba(212,168,83,.22);border-radius:100px;padding:.4rem 1.1rem;font-size:.62rem;letter-spacing:.12em}
.h-bdot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:bpulse 2s infinite;}
@keyframes bpulse{0%,100%{box-shadow:0 0 0 0 rgba(212,168,83,.5);}50%{box-shadow:0 0 0 8px rgba(212,168,83,0);}}

.h-name{font-family:'Playfair Display',serif;font-size:clamp(3rem,5vw,5.2rem);font-weight:900;line-height:1.04;letter-spacing:-.03em;animation:fadeUp .9s .12s ease both;}
.h-name .fn{color:var(--text);}
.h-name .ln{display:block;background:linear-gradient(110deg,var(--gold) 0%,var(--gold2) 30%,var(--teal) 60%,var(--violet) 85%,var(--gold) 100%);background-size:300% auto;-webkit-background-clip:text;color:transparent;animation:gradFlow 6s linear infinite;}
@keyframes gradFlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

.h-sub{margin-top:1.4rem;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);animation:fadeUp .9s .24s ease both;}
.h-sub span{color:var(--teal);margin:0 .35rem;}

.h-desc{margin-top:1.8rem;max-width:480px;font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--dim);line-height:1.9;animation:fadeUp .9s .38s ease both;}

.h-quote{margin-top:2.2rem;padding:1.1rem 1.4rem;border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(212,168,83,.04),transparent);font-family:'Playfair Display',serif;font-style:italic}
.h-quote cite{display:block;margin-top:.4rem;font-style:normal;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}

.h-cta{margin-top:2.5rem;display:flex;gap:1rem;flex-wrap:wrap;animation:fadeUp .9s .65s ease both;}
.btn-g{display:inline-flex;align-items:center;gap:.55rem;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#05070f;padding:.8rem 2rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;border-radius:10px;position:relative;overflow:hidden}
.btn-g::after{content:'';position:absolute;top:0;left:-75%;width:50%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shimmer 2.6s linear infinite}
@keyframes shimmer{0%{left:-75%;}50%{left:130%;}100%{left:130%;}}
.btn-g:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(212,168,83,.28);}
.btn-t{display:inline-flex;align-items:center;gap:.55rem;background:transparent;color:var(--teal);padding:.8rem 2rem;font-size:.68rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,0.02);border-radius:10px}
.btn-t:hover{background:rgba(14,165,233,.07);border-color:var(--teal);transform:translateY(-3px);}

/* CV download button */
.btn-cv{display:inline-flex;align-items:center;gap:.55rem;background:transparent;color:var(--dim);padding:.8rem 2rem;font-size:.68rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,0.02);border-radius:10px}
.btn-cv:hover{border-color:rgba(212,168,83,.3);color:var(--gold);transform:translateY(-3px);}

.h-soc{margin-top:2.5rem;display:flex;align-items:center;gap:1.2rem;animation:fadeUp .9s .8s ease both;}
.h-socline{width:35px;height:1px;background:var(--muted);} 
.soc-a{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--dim);text-decoration:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);}
.soc-a:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px) rotate(8deg) scale(1.1);}

/* HERO RIGHT */
.hero-right{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
.hr-split{position:absolute;top:0;right:0;bottom:0;width:40%;background:linear-gradient(160deg,rgba(14,165,233,.06),rgba(139,92,246,.04));clip-path:polygon(25% 0,100% 0,100% 100%,0 100%);} 
.hr-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,var(--bg) 0%,transparent 18%,transparent 65%,var(--bg) 100%),linear-gradient(to right,var(--bg) 0%,transparent 12%);}
.hr-photo-w{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:88%;height:96%;z-index:3;animation:photoReveal 1.3s .35s ease both;clip-path:inset(100% 0 0 0);} 
@keyframes photoReveal{to{clip-path:inset(0% 0 0 0);}}
.hr-photo{width:100%;height:100%;object-fit:cover;object-position:top center;filter:contrast(1.07) saturate(.92);} 

/* Corner frames */
.pf-tl{position:absolute;top:9%;left:7%;width:48px;height:48px;border-top:1.5px solid rgba(212,168,83,.5);border-left:1.5px solid rgba(212,168,83,.5);z-index:4;} 
.pf-br{position:absolute;bottom:9%;right:7%;width:48px;height:48px;border-bottom:1.5px solid rgba(14,165,233,.5);border-right:1.5px solid rgba(14,165,233,.5);z-index:4;} 

/* Floating bubbles */
.fb{position:absolute;z-index:5;background:rgba(5,7,15,.88);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);padding:.85rem 1.2rem;animation:fbFloat 4s ease-in-out infinite;} 
.fb::before{content:'';position:absolute;inset:-1px;border:1px solid rgba(212,168,83,.3);opacity:0;animation:fbGlow 4s ease-in-out infinite;pointer-events:none;} 
.fb2::before{border-color:rgba(14,165,233,.3);} 
.fb3::before{border-color:rgba(139,92,246,.3);} 
@keyframes fbGlow{0%,100%{opacity:0;}50%{opacity:1;}} 
.fb1{top:20%;left:2%;animation-delay:0s;} 
.fb2{top:52%;right:2%;animation-delay:1.8s;} 
.fb3{bottom:22%;left:4%;animation-delay:3.2s;} 
@keyframes fbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}} 
.fb-n{font-family:'Space Mono',monospace;font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;} 
.fb-l{font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:.15rem;} 

.hr-vtxt{position:absolute;right:1.2rem;top:50%;transform:translateY(-50%) rotate(90deg);font-size:.55rem;letter-spaci...(truncated for brevity)
